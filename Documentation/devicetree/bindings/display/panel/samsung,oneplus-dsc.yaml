%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,oneplus-dsc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung 1440x3120 DSC AMOLED panel of the OnePlus 7 Pro and 7T Pro

description:
  A 1440x3120 AMOLED panel in DSI command mode with DSC 1.1, two 720-pixel
  slices per line sent in one packet, as OnePlus's downstream kernel
  describes it (dsi_samsung_oneplus_dsc_cmd).

maintainers:
  - johannSo <jzeug@soppa.de>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: samsung,oneplus-dsc

  reg:
    maxItems: 1

  vddio-supply:
    description: I/O supply (1.8 V)

  reset-gpios: true
  port: true

required:
  - compatible
  - reg
  - vddio-supply
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,oneplus-dsc";
            reg = <0>;

            vddio-supply = <&vreg_l14a_1p8>;
            reset-gpios = <&tlmm 6 GPIO_ACTIVE_LOW>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
...
