%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx471.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX471 Sensor

maintainers:
  - Kate Hsuan <hpa@redhat.com>

description:
  The Sony IMX471 is a 16 MP CMOS image sensor with an active array of
  4656H x 3496V, controlled over I2C (CCI) and sending images over a
  four-lane MIPI CSI-2 D-PHY link.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx471

  reg:
    maxItems: 1

  clocks:
    description: The external clock (INCK), 19.2 MHz.
    maxItems: 1

  vana-supply:
    description: Analog supply (2.8 V).

  vdig-supply:
    description: Digital core supply (1.05 V).

  vif-supply:
    description: Interface supply (1.8 V).

  reset-gpios:
    description: The XCLR pin, active low.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@1a {
            compatible = "sony,imx471";
            reg = <0x1a>;
            clocks = <&cam_mclk2>;
            vana-supply = <&front_cam_vana>;
            vdig-supply = <&front_cam_vdig>;
            vif-supply = <&front_cam_vif>;
            reset-gpios = <&tlmm 12 GPIO_ACTIVE_LOW>;
            rotation = <270>;
            orientation = <0>;

            port {
                endpoint {
                    remote-endpoint = <&csiphy2_ep>;
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <200000000>;
                };
            };
        };
    };
...
