%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx586.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX481 and IMX586 sensors with register tables from firmware

maintainers:
  - johannSo <jzeug@soppa.de>

description:
  The Sony IMX586 (48 MP, 8000x6000 quad-Bayer) and IMX481 (16 MP,
  4656x3496) CMOS image sensors, controlled over I2C (CCI) and sending
  images over MIPI CSI-2 (D-PHY, or C-PHY on some IMX586 modules). Their
  initialisation and mode settings are loaded from the firmware file named
  by firmware-name; the modes whose link frequency is not listed in the
  endpoint are not offered.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    enum:
      - sony,imx481
      - sony,imx586

  reg:
    maxItems: 1

  clocks:
    description: The external clock (INCK), at the rate the tables expect.
    maxItems: 1

  firmware-name:
    maxItems: 1
    description: The register table file.

  vana-supply:
    description: Analogue supply.

  vana2-supply:
    description: A second analogue switch, enabled after vana.

  vdig-supply:
    description: Digital core supply.

  vdig2-supply:
    description: A second digital switch, enabled after vdig.

  vif-supply:
    description: Interface supply (1.8 V), enabled last.

  reset-gpios:
    description: The XCLR pin, active low.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          bus-type:
            enum:
              - 1 # MEDIA_BUS_TYPE_CSI2_CPHY
              - 4 # MEDIA_BUS_TYPE_CSI2_DPHY

          data-lanes:
            minItems: 1
            maxItems: 4

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - firmware-name
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@1a {
            compatible = "sony,imx586";
            reg = <0x1a>;
            clocks = <&cam_mclk1>;
            firmware-name = "omamobile/sony-imx586.bin";
            vana-supply = <&cam_main_vana>;
            vdig-supply = <&cam_main_vdig>;
            vif-supply = <&cam_vio>;
            reset-gpios = <&tlmm 30 GPIO_ACTIVE_LOW>;
            orientation = <1>;
            rotation = <90>;

            port {
                endpoint {
                    remote-endpoint = <&csiphy1_ep>;
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <600000000>;
                };
            };
        };
    };
...
