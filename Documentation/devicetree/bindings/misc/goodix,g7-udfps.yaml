%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/goodix,g7-udfps.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Goodix optical under-display fingerprint sensor (secure world bus)

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  Goodix optical fingerprint sensor under an OLED panel, as in the Google
  Pixel 7 Pro and the OnePlus 7T Pro. Its SPI bus is owned by a trusted
  application in the secure world (Trusty on the Pixel, QSEE on the OnePlus),
  so the node is not on an SPI controller; it describes only the lines the
  application processor drives.

properties:
  compatible:
    enum:
      - goodix,g7-udfps
      - oneplus,hotdog-udfps

  interrupts:
    maxItems: 1
    description: Sensor event line (rising edge).

  reset-gpios:
    maxItems: 1

  vdd-supply:
    description: Sensor analog supply.

  clocks:
    description:
      Clocks of the SPI controller the secure world drives the sensor
      through, which only the application processor can turn on. They are
      kept on while the sensor is powered.
    maxItems: 3

  clock-names:
    items:
      - const: se
      - const: m-ahb
      - const: s-ahb

required:
  - compatible
  - interrupts
  - reset-gpios

dependentRequired:
  clocks: [ clock-names ]

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    fingerprint {
        compatible = "goodix,g7-udfps";
        interrupt-parent = <&gpa9>;
        interrupts = <2 IRQ_TYPE_EDGE_RISING>;
        reset-gpios = <&gpp1 1 GPIO_ACTIVE_LOW>;
    };
  - |
    #include <dt-bindings/clock/qcom,gcc-sm8150.h>
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    fingerprint {
        compatible = "oneplus,hotdog-udfps";
        interrupts-extended = <&tlmm 118 IRQ_TYPE_EDGE_RISING>;
        reset-gpios = <&tlmm 131 GPIO_ACTIVE_LOW>;
        clocks = <&gcc GCC_QUPV3_WRAP0_S3_CLK>,
                 <&gcc GCC_QUPV3_WRAP_0_M_AHB_CLK>,
                 <&gcc GCC_QUPV3_WRAP_0_S_AHB_CLK>;
        clock-names = "se", "m-ahb", "s-ahb";
    };
